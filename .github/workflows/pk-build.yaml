name: Build prokube flavored MLflow OIDC Auth Image

on:
  pull_request:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - pk-build
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # Fork PRs run without secrets; first-party branch/manual and validated tag runs may publish.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select image destination and tags
        id: image
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          export OIDC_VERSION="$(make --silent print-oidc-version)"
          bash scripts/image-tags.sh >> "$GITHUB_OUTPUT"
      - name: Require release source on pk-main
        id: release-source
        if: steps.image.outputs.release == 'true'
        run: git merge-base --is-ancestor HEAD origin/pk-main
      - name: Build image
        run: make build-image IMAGE=mlflow-oidc-auth:ci
      - name: Verify installed versions
        run: make smoke-image IMAGE=mlflow-oidc-auth:ci
      - name: Auth GCloud CLI
        if: github.repository == 'prokube/mlflow-oidc-auth' && github.event_name != 'pull_request' && steps.image.outputs.publish == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Docker Login to Google Artifact Registry
        if: github.repository == 'prokube/mlflow-oidc-auth' && github.event_name != 'pull_request' && steps.image.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: europe-west3-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}
      - name: Publish image
        if: github.repository == 'prokube/mlflow-oidc-auth' && github.event_name != 'pull_request' && steps.image.outputs.publish == 'true'
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
          COMMIT_TAG: ${{ steps.image.outputs.commit_tag }}
        run: |
          set -euo pipefail
          docker tag mlflow-oidc-auth:ci "$IMAGE_TAG"
          docker push "$IMAGE_TAG"
          if [[ -n "$COMMIT_TAG" ]]; then
            docker tag mlflow-oidc-auth:ci "$COMMIT_TAG"
            docker push "$COMMIT_TAG"
          fi
          docker image inspect "$IMAGE_TAG" --format '{{index .RepoDigests 0}}' >> "$GITHUB_STEP_SUMMARY"
