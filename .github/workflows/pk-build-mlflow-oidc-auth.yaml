name: Build MLflow OIDC Auth Image

on:
  push:
    branches:
      - 'pk-internal-build-branch'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'mlflow_oidc_auth/**'
      - 'web-react/**'
      - 'pyproject.toml'
      - 'buildfiles/**'
      - '.github/workflows/pk-build-mlflow-oidc-auth.yaml'
  workflow_dispatch:

env:
  IMAGE_NAME: "mlflow-oidc-auth"

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auth GCloud CLI
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Docker Login to Google Artifact Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: europe-west3-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Prepare build context
        run: |
          cp -r mlflow_oidc_auth buildfiles/
          cp -r web-react buildfiles/
          cp pyproject.toml buildfiles/mlflow_oidc_auth_pyproject.toml

      - name: Build image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.IMAGE_NAME }}:ci-${{ github.sha }} \
            -f buildfiles/Dockerfile \
            buildfiles/

      - name: Push image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_PUSH_PATH: ${{ secrets.GCP_ARTIFACT_REGISTRY_PATH }}
        run: |
          MLFLOW_VERSION=$(python -c 'import tomllib; print(next(dep.split("==", 1)[1] for dep in tomllib.load(open("buildfiles/pyproject.toml", "rb"))["project"]["dependencies"] if dep.startswith("mlflow==")))')
          LOCAL_TAG=${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          LATEST_TAG=${IMAGE_PUSH_PATH}/${{ env.IMAGE_NAME }}:latest
          COMMIT_TAG=${IMAGE_PUSH_PATH}/${{ env.IMAGE_NAME }}:commit-${{ github.sha }}
          MLFLOW_VERSION_TAG=${IMAGE_PUSH_PATH}/${{ env.IMAGE_NAME }}:mlflow-${MLFLOW_VERSION}

          docker tag $LOCAL_TAG $LATEST_TAG
          docker tag $LATEST_TAG $COMMIT_TAG
          docker tag $LATEST_TAG $MLFLOW_VERSION_TAG
          docker push $LATEST_TAG
          docker push $COMMIT_TAG
          docker push $MLFLOW_VERSION_TAG
          # If triggered by a git tag, also push with that tag name
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            GIT_TAG="${{ github.ref_name }}"
            echo "Git tag detected: $GIT_TAG"
            docker tag $LATEST_TAG ${{ env.IMAGE_PUSH_PATH }}/${{ env.IMAGE_NAME }}:$GIT_TAG
            docker push ${{ env.IMAGE_PUSH_PATH }}/${{ env.IMAGE_NAME }}:$GIT_TAG
          fi
